<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logise</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f4f0e6;
            --ink: #161513;
            --mute: #8a8478;
            --line: rgba(22, 21, 19, 0.12);
            --hover: rgba(22, 21, 19, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            min-height: 100%;
        }

        body {
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
        }

        .grain {
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.05;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        main, footer {
            position: relative;
            z-index: 1;
        }

        main {
            width: min(760px, 100% - 40px);
            margin: 0 auto;
            padding: 56px 0 48px;
        }

        .hero {
            margin-bottom: 36px;
        }

        h1 {
            font-family: "Instrument Serif", Georgia, serif;
            font-weight: 400;
            font-size: clamp(32px, 5.4vw, 52px);
            line-height: 1.14;
            letter-spacing: -0.03em;
            text-wrap: balance;
        }

        .blank {
            color: inherit;
            background: none;
            border: 0;
            padding: 0;
            font: inherit;
            font-style: italic;
            border-bottom: 1px solid var(--ink);
            white-space: nowrap;
        }

        .list {
            display: flex;
            flex-direction: column;
            border-top: 1px solid var(--line);
        }

        .row {
            width: 100%;
            display: grid;
            grid-template-columns: 2.2em minmax(0, 1fr) auto;
            gap: 14px;
            align-items: baseline;
            padding: 13px 2px;
            border-bottom: 1px solid var(--line);
            color: inherit;
            text-decoration: none;
            transition: background 0.2s;
        }

        .row:hover,
        .row:focus-visible {
            background: var(--hover);
            outline: none;
        }

        .row-rank {
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 11px;
            color: var(--mute);
        }

        .row-name {
            font-size: 20px;
            letter-spacing: -0.03em;
        }

        .row-meta {
            font-family: "IBM Plex Mono", ui-monospace, monospace;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        .status {
            padding: 13px 2px;
            color: var(--mute);
            font-size: 16px;
            border-bottom: 1px solid var(--line);
        }

        footer {
            width: min(760px, 100% - 40px);
            margin: 0 auto 72px;
            color: var(--mute);
            font-size: 12px;
        }

        .credit {
            position: fixed;
            right: 18px;
            bottom: 12px;
            z-index: 3;
            font-family: Caveat, "Segoe Script", cursive;
            font-size: 18px;
            font-weight: 500;
            color: rgb(122, 115, 104);
            pointer-events: none;
        }

        @media (max-width: 520px) {
            main {
                padding-top: 32px;
            }

            .row {
                grid-template-columns: 1.8em minmax(0, 1fr);
                gap: 8px;
                padding: 12px 2px;
            }

            .row-name {
                font-size: 18px;
            }

            .row-meta {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="grain" aria-hidden="true"></div>

    <main>
        <header class="hero">
            <h1>Mis <span class="blank">Proyectos</span>!</h1>
        </header>

        <div class="list" id="projects">
            <p class="status">Cargando proyectos…</p>
        </div>
    </main>

    <footer>
        <p>proyectos y experimentos.</p>
    </footer>

    <p class="credit">Logise</p>

    <script>
        const list = document.getElementById("projects");
        const pad = (n) => String(n).padStart(2, "0");

        const hostLabel = (link) => {
            try {
                const url = new URL(link, window.location.origin);
                if (url.hostname.replace(/^www\./, "") === window.location.hostname.replace(/^www\./, "")) {
                    return url.pathname.replace(/\/$/, "") || "/";
                }
                return url.hostname.replace(/^www\./, "");
            } catch {
                return link;
            }
        };

        const render = (projects) => {
            list.innerHTML = "";

            if (!projects.length) {
                list.innerHTML = '<p class="status">No hay proyectos todavía.</p>';
                return;
            }

            projects.forEach((project, i) => {
                const row = document.createElement("a");
                row.className = "row";
                row.href = project.link;
                row.innerHTML = `
                    <span class="row-rank">${pad(i + 1)}</span>
                    <span class="row-name">${project.alt || "Proyecto"}</span>
                    <span class="row-meta">${hostLabel(project.link)}</span>
                `;
                list.appendChild(row);
            });
        };

        fetch("projects.json", { cache: "no-store" })
            .then((res) => {
                if (!res.ok) throw new Error("local");
                return res.json();
            })
            .catch(() =>
                fetch("https://logise1.github.io/projects.json").then((res) => {
                    if (!res.ok) throw new Error("remote");
                    return res.json();
                })
            )
            .then(render)
            .catch(() => {
                list.innerHTML = '<p class="status">No se pudieron cargar los proyectos.</p>';
            });
    </script>
</body>
</html>
